<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《忍者喵喵》同人小說錄・線上閱讀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(226, 232, 240, 0.85);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --text-article: #1e293b;
      --cherry: #f43f5e;
      --cherry-light: #ffe4e6;
      --cherry-hover: #e11d48;
      --sky: #0ea5e9;
      --sky-light: #e0f2fe;
      --accent-gradient: linear-gradient(135deg, #f43f5e 0%, #fb7185 50%, #38bdf8 100%);
      --accent-glow: rgba(244, 63, 94, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(180deg, #f1f5f9 0%, #f8fafc 30%, #ffffff 100%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', "Noto Sans TC", sans-serif;
      min-height: 100vh;
      line-height: 1.75;
      scroll-behavior: smooth;
    }

    /* 頂部導航欄 - 手機自適應防擠壓變形 */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 6%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      gap: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      cursor: pointer;
      flex-shrink: 0;
    }
    .brand-badge {
      background: var(--accent-gradient);
      color: #fff;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }
    .brand-name {
      font-size: 1.25rem;
      font-weight: 800;
    }

    /* 標籤群組：支援手機端平滑橫向滾動，永不變形折行 */
    .nav-tabs {
      display: flex;
      gap: 6px;
      align-items: center;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      max-width: 100%;
    }
    .nav-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      padding: 7px 15px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      flex-shrink: 0;
    }
    .tab-btn:hover {
      color: var(--cherry);
    }
    .tab-btn.active {
      background: #ffffff;
      color: var(--cherry);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .tab-btn.tab-focus {
      background: rgba(244, 63, 94, 0.1);
      color: var(--cherry);
    }
    .tab-btn.tab-focus.active {
      background: var(--accent-gradient);
      color: #ffffff;
    }

    /* 首頁英雄展示區 */
    .hero-container {
      max-width: 1140px;
      margin: 40px auto 50px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 48px;
      align-items: center;
    }
    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--cherry-light);
      color: #e11d48;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 18px;
      width: fit-content;
    }
    .hero-title {
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(2.1rem, 4vw, 3.1rem);
      font-weight: 900;
      line-height: 1.3;
      color: #0f172a;
      margin-bottom: 18px;
    }
    .gradient-text {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-subtitle {
      font-size: 1.05rem;
      color: var(--text-sub);
      margin-bottom: 30px;
      line-height: 1.75;
    }
    .cta-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .btn-main {
      display: inline-flex;
      align-items: center;
      padding: 12px 26px;
      background: var(--accent-gradient);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 8px 20px var(--accent-glow);
      transition: all 0.25s ease;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(244, 63, 94, 0.35);
    }

    /* 右側立體卡片 */
    .hero-card-wrap {
      position: relative;
      display: flex;
      justify-content: center;
    }
    .card-ambient-glow {
      position: absolute;
      width: 90%;
      height: 90%;
      background: radial-gradient(circle, rgba(251, 113, 133, 0.25) 0%, rgba(56, 189, 248, 0.2) 60%, transparent 80%);
      filter: blur(40px);
      z-index: 1;
    }
    .hero-preview-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--card-border);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      transition: transform 0.35s ease;
      cursor: pointer;
    }
    .hero-preview-card:hover {
      transform: translateY(-5px);
    }
    .preview-img-container {
      width: 100%;
      height: 380px;
      overflow: hidden;
      background: #f1f5f9;
    }
    .preview-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.4s ease;
    }
    .hero-preview-card:hover .preview-img-container img {
      transform: scale(1.03);
    }
    .preview-footer {
      padding: 16px 20px;
      background: #ffffff;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
    }
    .preview-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--cherry);
    }

    /* 快捷章節卡片網格 */
    .section-container {
      max-width: 1140px;
      margin: 0 auto 60px auto;
      padding: 0 24px;
    }
    .section-title-bar {
      margin-bottom: 24px;
    }
    .section-h2 {
      font-size: 1.55rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .section-desc {
      color: var(--text-sub);
      font-size: 0.95rem;
    }
    .chapters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
    }
    .chapter-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.03);
    }
    .chapter-card:hover {
      transform: translateY(-5px);
      border-color: #cbd5e1;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.08);
    }
    .card-thumb {
      position: relative;
      width: 100%;
      height: 190px;
      overflow: hidden;
      background: #f8fafc;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.4s ease;
    }
    .chapter-card:hover .card-thumb img {
      transform: scale(1.05);
    }
    .episode-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      color: #334155;
    }
    .episode-tag.highlight {
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: #ffffff;
    }
    .episode-tag.latest {
      background: rgba(14, 165, 233, 0.95);
      color: #ffffff;
    }
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
      line-height: 1.45;
    }
    .card-text {
      color: var(--text-sub);
      font-size: 0.88rem;
      line-height: 1.6;
      margin-bottom: 16px;
      flex: 1;
    }
    .card-action {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--cherry);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 內嵌沉浸式閱讀器 */
    .reader-wrapper {
      max-width: 860px;
      margin: 30px auto 80px auto;
      padding: 0 20px;
      display: none;
    }
    .reader-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.05);
      position: relative;
    }
    .reader-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid #f1f5f9;
    }
    .reader-breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }
    .reader-back-btn {
      color: var(--cherry);
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .chapter-heading {
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 900;
      color: #0f172a;
      line-height: 1.38;
      margin-bottom: 30px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--cherry-light);
    }
    .novel-body p {
      font-size: 1.08rem;
      line-height: 2.05;
      color: var(--text-article);
      margin-bottom: 1.6em;
      text-indent: 2em;
      letter-spacing: 0.4px;
    }
    .quote-box {
      background: #f8fafc;
      border-left: 4px solid var(--sky);
      padding: 16px 20px;
      margin: 24px 0;
      border-radius: 0 12px 12px 0;
      font-style: italic;
      color: #334155;
      font-size: 1rem;
      white-space: pre-line;
    }
    .dialogue-critical {
      text-indent: 0 !important;
      font-size: 1.6rem;
      font-weight: 900;
      color: #e11d48;
      text-align: center;
      letter-spacing: 5px;
      margin: 36px 0;
      text-shadow: 0 0 18px rgba(244, 63, 94, 0.35);
    }
    .cg-container {
      margin: 36px 0;
      display: flex;
      justify-content: center;
    }
    .cg-frame {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .cg-frame:hover {
      transform: translateY(-4px);
    }
    .novel-cg {
      width: 100%;
      height: auto;
      display: block;
    }
    .cg-caption {
      padding: 12px 16px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-sub);
      background: #f8fafc;
      border-top: 1px solid #f1f5f9;
      font-weight: 600;
    }
    .reader-nav-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #f1f5f9;
    }
    .page-turn-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #ffffff;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .page-turn-btn:hover {
      border-color: var(--cherry);
      color: var(--cherry);
      transform: translateY(-2px);
    }

    /* 燈箱大圖 */
    .lightbox-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .lightbox-modal.active {
      display: flex;
      opacity: 1;
    }
    .lightbox-img {
      max-width: 90vw;
      max-height: 84vh;
      border-radius: 12px;
      box-shadow: 0 14px 48px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .lightbox-caption {
      margin-top: 14px;
      font-size: 1rem;
      color: #f8fafc;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 32px;
      font-size: 2.2rem;
      color: #e2e8f0;
      cursor: pointer;
      user-select: none;
    }
    .lightbox-close:hover { color: var(--cherry); }

    footer {
      text-align: center;
      padding: 36px 20px;
      color: #94a3b8;
      font-size: 0.88rem;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
    }

    @media (max-width: 860px) {
      .top-nav {
        flex-direction: column;
        align-items: stretch;
        padding: 10px 16px;
        gap: 10px;
      }
      .brand {
        justify-content: center;
      }
      .nav-tabs {
        width: 100%;
        justify-content: flex-start;
        padding: 4px;
      }
      .hero-container { grid-template-columns: 1fr; gap: 32px; text-align: center; }
      .hero-tag { margin: 0 auto 16px auto; }
      .hero-subtitle { margin: 0 auto 28px auto; }
      .cta-row { justify-content: center; }
      .reader-card { padding: 30px 18px; }
      .novel-body p { font-size: 1.02rem; text-indent: 1.8em; }
    }
  </style>
</head>
<body>

  <!-- 頂部導航欄 -->
  <header class="top-nav">
    <div class="brand" onclick="switchView('home')">
      <span class="brand-badge">NOVEL</span>
      <span class="brand-name">忍者喵喵</span>
    </div>
    <div class="nav-tabs" id="nav-tabs-container">
      <button class="tab-btn active" id="tab-home" onclick="switchView('home')">首頁總覽</button>
      <!-- 動態從 chapters/manifest.json 生成分頁標籤 -->
    </div>
  </header>

  <!-- 首頁主視覺視圖 -->
  <div id="home-view">
    <main class="hero-container">
      <div class="hero-text-block">
        <div class="hero-tag">
          <span>✦</span>
          <span>都市日常與異界劍姬的邂逅</span>
        </div>
        <h1 class="hero-title">
          拉單槓的午後散策，<br>
          遇見<span class="gradient-text">單槓場上的鬼角劍姬</span>
        </h1>
        <p class="hero-subtitle">
          原以為只是個常見的劣質手遊廣告，直到在平靜的社區公園單槓區旁，迎面走來那名身著破格和服羽織、步伐如忍術般輕巧無聲的少女……
        </p>
        <div class="cta-row">
          <button class="btn-main" onclick="openChapter(1)">從第一節開始閱讀 →</button>
          <button class="btn-main" style="background: #ffffff; color: var(--text-main); border: 1px solid var(--card-border); box-shadow: none;" onclick="openChapter(5)">最新進度：第五節 粉髮男子</button>
        </div>
      </div>

      <!-- 右側卡片展示 -->
      <div class="hero-card-wrap">
        <div class="card-ambient-glow"></div>
        <div class="hero-preview-card" onclick="openChapter(2)">
          <div class="preview-img-container">
            <img src="images/cg_sakura.jpg" alt="落櫻側顏特寫">
          </div>
          <div class="preview-footer">
            <div class="preview-title">落櫻流轉・側顏之謎</div>
            <div class="preview-tag">點擊進入焦點特寫 ✦</div>
          </div>
        </div>
      </div>
    </main>

    <!-- 章節瀏覽選單 -->
    <section class="section-container">
      <div class="section-title-bar">
        <h2 class="section-h2">章節目錄</h2>
        <p class="section-desc">自動讀取純文字章節庫，點擊卡片即可展開無縫閱讀</p>
      </div>

      <div class="chapters-grid" id="chapters-grid-container">
        <!-- 動態從 chapters/manifest.json 生成卡片 -->
      </div>
    </section>
  </div>

  <!-- 內嵌閱讀器視圖 -->
  <div class="reader-wrapper" id="reader-view">
    <article class="reader-card">
      <div class="reader-toolbar">
        <div class="reader-breadcrumb">
          <span class="reader-back-btn" onclick="switchView('home')">← 返回章節總覽</span>
          <span>/</span>
          <span id="reader-ep-label" style="font-weight: 700; color: var(--cherry);">EPISODE 01</span>
        </div>
        <div style="font-size: 0.88rem; color: var(--text-sub);">
          點擊插圖可放大預覽
        </div>
      </div>

      <div id="reader-content-target">
        <!-- 動態載入 -->
      </div>

      <div class="reader-nav-controls">
        <button class="page-turn-btn" id="prev-btn" onclick="turnPage(-1)">← 上一節</button>
        <button class="page-turn-btn" style="border-color: #cbd5e1;" onclick="switchView('home')">回目錄</button>
        <button class="page-turn-btn" id="next-btn" onclick="turnPage(1)">下一節 →</button>
      </div>
    </article>
  </div>

  <footer>
    《忍者喵喵》同人小說錄 · 純文字與前端分離架構 · 支援 GitHub Pages 與 Netlify
  </footer>

  <!-- 燈箱彈窗 -->
  <div class="lightbox-modal" id="lightboxModal" onclick="closeModal(event)">
    <span class="lightbox-close" onclick="closeModal(event)">&times;</span>
    <img src="" alt="" class="lightbox-img" id="modalImg" onclick="event.stopPropagation()">
    <div class="lightbox-caption" id="modalCaption"></div>
  </div>

面，狀態欄依然是一片安靜無聲的等待審核，『好像還真沒有，一直卡著沒通過的樣子。』\n\n「搞什麼啊？我去問一下幹部。」\n\n過了幾分鐘，夜雨發來一個笑到流淚的貼圖：「幹部說你之前的申請紀錄答錯問題被系統踢了啦！你趕快重新申請一次，我幫你打聲招呼。」\n\n我有些尷尬地再次送出申請。這一次，幾乎是秒通過。\n\n伴隨著一陣歡迎新人的系統提示，迎面而來的不是什麼友善的問候，而是一長串我完全看不懂的古怪ID，以及撲面而來的「新手身分洗禮」：\n\n「來了個新人？等等，這不是那個填『最喜歡的技能是無糖綠』的傢伙嗎ｗｗｗ」\n\n「笑死，把手搖飲當必殺技的勇者出現了！」\n\n「要記得我是河童王，也是這個群的王！」河童王說。\n\n「老實交代，是不是假帳號？是不是賣茶的廣告機器人？通關密語是什麼？快說！」\n\n看著群組裡七嘴八舌的拷問，為了自證清白不是詐騙，我只得硬著頭皮一一回答那些刁鑽古怪的手遊問題。\n\n一邊打字解釋，我一邊在心裡默默吐槽：\n\n其實我到現在也沒想明白，當初為什麼腦袋一抽，會覺得「無糖綠」聽起來像是一招足以毀天滅地的終極忍術。", "4": "第四節：免抽——「這次你的名字叫無糖綠嗎？」\n\n在河童王Line社群被那群滿嘴怪話的傢伙用「無糖綠勇者」的名號狠狠洗禮了一頓後，我算是徹底融入了這個沙雕氛圍拉滿的群組。\n\n每天清晨六點，遊戲伺服器準時重置。\n《忍者喵喵》雖然免洗，但福利給得還算大方——每日都有免費單抽的轉盤，以及號稱有「極低機率直接獲得主角限定特裝」的祈願池。\n\n我一手拿著剛順路從小七買的冰鎮無糖綠茶，一手面無表情地在螢幕上胡亂點擊，熟練地把所有冒著紅點的「每日免費」一鍵按了過去。\n\n不出所料，前面幾抽全是一堆綠色、紫色的最低等寶石。輪到那個號稱放了「UR特裝」的限定池時，這次的看板娘是特別裝扮的「綾」——換上了日系學生妹造型。我隨手一抽，果不其然又是顆破爛石頭。\n也是呢，免費抽怎麼可能會中？\n\n接著我順手滑過介面，把積攢的免費抽獎全給點了。就在按下最後一次確認時，螢幕突然金光大作，畫面一轉，竟然猛地跳出了稀有角色的特寫展示動畫！\n\n看來是要中了？\n畫面中浮現出一抹極其張揚的粉紅色長髮，隨風輕輕舞動，美得近乎虛幻。\n咦？粉紅色？\n等等……限定池裡的特裝「綾」有粉紅色頭髮的造型嗎？\n\n還沒等我看清立繪的細節，手機螢幕猛地一黑——《忍者喵喵》直接閃退了！\n我手忙腳亂地長按圖示重啟，結果 App 像是中邪一樣轉圈卡死，怎麼點也打不開。\n\n「靠……該死！我好不容易中了第一件限定特裝，結果你給我閃退？官方這不會不認帳吧？！」\n\n我無奈地嘆了口氣，隨手將手機螢幕按滅，鬱悶地扔回口袋。\n\n扭開瓶蓋，我仰頭猛灌了一大口無糖綠茶。冰涼苦澀的茶湯順著食道滑落，瞬間驅散了清晨的微醺睡意。\n我把空瓶放在公園長椅旁，熟練地走到那根熟悉的鐵單槓前。\n\n掌心貼上微涼粗糙的鐵管，雙臂發力，整個人俐落地懸空拉起。\n一下、兩下。\n呼氣、吸氣。\n\n日復一日的規律律動，讓肌肉在緊繃與舒展間微微發酸。四周的樹葉在晨風中沙沙作響，社區公園一片靜謐。\n\n然而，就在我拉到第七下、整個人懸在最高點的剎那——\n\n『你不記得我嗎？』\n\n一道清脆中透著慵懶、卻彷彿直接穿透耳膜的少女呢喃，毫無預兆地在我的腦海正中央驟然炸響！\n\n『誰？！』\n我不自覺地脫口問了出來，雙手下意識收緊，心臟劇烈地狂跳起來。\n\n這種陌生又熟悉的感覺到底是什麼？這股直擊靈魂深處的震顫感，絕不是普通幻聽，而是像某塊被遺忘在記憶深海裡的古老碎片被硬生生翻動了一般。\n\n還沒等我從震撼中回過神，那道嗓音帶著一絲極其淡薄的哀傷，幽幽從心底傳來：\n\n「記得來找我。我是円香……」\n「這一次，你的名字叫無糖綠嗎？」\n\n『啊？什麼這次？！円香又是誰？！』\n\n驚駭與混亂如潮水般席捲大腦，雙手的握力瞬間潰散！\n「砰！」\n我整個人完全失去了平衡，結結實實地再次摔進了單槓下方的沙坑與泥地裡。\n\n「咳……痛死了……」\n泥土與落葉濺了我一頭一臉。我甚至顧不上手肘擦破皮的火辣刺痛，慌忙地一邊用力甩著發懵的腦袋與痠麻的手臂，一邊猛地睜開雙眼——\n\n心臟在胸膛裡瘋狂跳動，呼吸急促得難以平復。\n我下意識帶著幾分莫名的期待與緊張環視四周，迫切地想知道，是不是一睜眼，又能看見那位披著赤紅烈焰和服、頭頂潔白鬼角的美麗少女，正居高臨下、用那雙冷艷赤紅的瞳孔睥睨著我……\n\n然而，微風拂面，晨光靜謐。\n眼前除了空蕩蕩的鐵單槓與幾片飄落的枯葉之外，什麼都沒有。\n\n沒有粉髮，沒有鬼角，更沒有那柄朱紅色的武士刀。\n\n空曠的公園裡，只有我自己粗重紊亂的喘息聲，以及口袋裡不知何時因為社群訊息而微微震動的手機。", "5": "第五節：狂奔的粉髮男子——「有事情要發生了」\n\n在那天莫名摔進沙坑之後，我像是著了魔一樣，每天到了固定的清晨時間就會準時走到社區公園的單槓場報到。\n\n至於《忍者喵喵》，我已經有一段時間沒能登入進去了。每當點開圖示，螢幕總是無休止地卡在「伺服器維護更新中」的提示框。我在河童王群組裡問了一圈，甚至給官方客服寄了三封回饋信，結果全都是石沉大海毫無回音。久而久之，我也懶得再去看群組裡那群傢伙講幹話了。\n\n今天剛好是週末，原本寧靜的公園竟然又聚集了不少人潮。五顏六色的假髮在樹蔭下晃動，看樣子又有 Coser 社團挑了這裡當外拍展場。\n\n我漫無目的地走在公園步道上，四處張望著。\n這裡今天可熱鬧了，路邊走過一頭綠色短髮的不知名動漫角色，另一邊還有人神還原了《獵人》裡的大傑——那根朝天豎起的大黑髮柱又粗又挺又帥氣，回頭率百分之兩百。\n\n在五彩斑斕的人群中，我的目光忽然被一抹熟悉的色彩狠狠刺痛了一下。\n\n粉色？\n真的是粉色！\n\n只見最靠邊緣的單槓旁，靜靜站著一道披著寬鬆和服羽織的身影，背後同樣斜斜綁著一柄朱紅刀鞘的武士刀，一頭張揚的粉色長髮隨風微微起伏，正伸手握在單槓上做著引體向上。\n\n是她！絕對是她！\n\n心臟驟然漏跳了半拍，我腦袋一熱，整個人拔腿就朝那根單槓衝了過去，一邊狂奔一邊扯著嗓子大喊：\n「小姐！小姐！上次真的不好意思——！」\n\n誰知道就在我喊出聲的瞬間，那個粉髮身影彷彿受了天大的驚嚇，連頭都沒回，鬆開單槓轉身就跑！\n\n「喂！等等啊！」\n我撒開雙腿死命在後面追。可對方的腳程簡直快得反常，兩條長腿邁開的頻率快如疾風，像一輛裝了渦輪引擎的跑車。任憑我如何蹬腿狂奔，彼此之間的距離非但沒有拉近，反而被越甩越遠。\n\n「呼……哈……奇怪……怎麼會這麼喘……」\n我胸膛劇烈起伏，喉嚨乾得像被火燒過一樣。我平常天天拉單槓鍛鍊背肌，體力什麼時候變得這麼差了？\n還是說……那女生的體力真的好到離譜？\n不過話說回來，體力這麼好的女生，我……我好像還真挺喜歡的。\n\n腦子裡剛閃過這個不著邊際的念頭，雙腿卻已經徹底脫力發軟。視線一陣天旋地轉，我腳下一絆，「咚」地一聲直接栽倒在草坪上昏了過去。\n\n……\n\n「先生？先生！你還好嗎？！快醒醒啊！」\n一陣焦急又低沉的呼喚聲在耳邊不斷迴盪，同時有人正慌張地拍著我的肩膀。\n\n我的意識仍陷在一片混沌與矇矓之中，眼皮沉重得完全睜不開。模糊的視野裡，隱隱約約只有一抹隨風輕晃的櫻粉色長髮映入眼簾。\n\n粉紅色頭髮……？\n難道是……剛才那位單槓場上的鬼角少女？！\n\n我的雙手虛弱地在半空中胡亂揮舞了一下，本能地想要抓住對方借力撐起身子。掌心不偏不倚，剛好按上了一團極具存在感的隆起物上。\n\n手感非常扎實。我半夢半醒間下意識地捏了捏——\n好軟？\n不對……\n這觸感怎麼硬邦邦的，簡直就像一塊被緊繃皮膚包裹著的花崗岩板磚？！\n\n「先生……你醒了嗎？」\n耳邊傳來的聲音聽起來既著急又帶著難以言喻的尷尬。\n\n我腦袋昏昏沉沉，迷迷糊糊地喃喃自語：「你……你是誰啊……」\n\n對方頓了一下，語氣異常複雜，甚至帶著一絲微顫，並沒有回答我的問題，而是低聲提醒道：\n「那個……先生，你、你抓著我的胸部。」\n\n胸部？\n迷濛間，我的腦海瞬間閃過上次跌倒時仰望看見的那抹驚心動魄的危險弧度。難道真是那位冷冰冰罵我變態的粉髮大美女？！\n出於某種難以言喻的潛意識確認，我的手指竟然又控制不住地收緊，下意識地抓了幾下。\n\n好軟？\n不對啊！這根本硬得跟練了鐵布衫一樣！\n\n電光石火間，我整個人打了個寒顫，猛地倒抽一口涼氣，雙眼瞬間瞪得滾圓！\n\n視野徹底清晰。\n眼前哪有什麼冷艷如霜的和服美少女？！\n映入眼簾的，是一位身材高大、骨架寬闊、身高逼近一米八五的健壯男子！他頭頂戴著一頂極其張揚的粉色長假髮，身上披著一件大敞的和服，而我的兩隻手……正死死按在他那兩塊線條分明、厚實飽滿、堅硬如鐵的碩大胸肌上！\n\n甚至因為剛才的劇烈運動，他的胸肌還在隨著粗重的喘息微微起伏。\n\n空氣瞬間死寂。\n我和粉髮男子四目相對。\n\n『哇啊啊啊啊啊——！！』\n殘留的睡意與迷濛在零點一秒內徹底灰飛煙滅！世界觀當場碎裂成渣，我嚇得魂飛魄散，一把抽回雙手，連滾帶爬地往後暴退，扯著嗓子放聲尖叫：\n『不要過來啊！救命啊！有變態啊！！』\n\n粉髮男子見我突然發狂，也慌忙伸手想拉我一把，焦急地喊道：\n「先生！先生你冷靜點！我……我香……」\n\n『你別過來！你才不香！你全家都不香！救命啊——！』\n光天化日之下竟然被一個穿著和服女裝、頂著粉色長髮的肌肉猛男近距離貼身照顧，我的求生本能瞬間突破極限。我根本不等他說完，手腳並用從草地上彈起來，拔腿就往公園外狂奔——要是跑慢半秒，我的清白跟屁股絕對不保！\n\n然而，對方的腳程快得匪夷所思。\n我連三個轉角都還沒繞出去，耳邊便傳來一陣呼嘯的破風聲！只見眼前粉影一閃，那堵由厚實大胸肌築成的人形高牆已經鬼魅般橫擋在前方，將我硬生生逼進了公園圍牆的死角裡。\n\n我後背貼著冰涼的牆面，雙手抱頭瑟瑟發抖，閉上眼睛絕望求饒：\n『壯士饒命！別傷害我！我身上沒錢也沒色相！』\n\n「先生……你、你的手機。」\n頭頂傳來一聲有些無奈的嘆息。\n\n『……咦？手機？』\n我小心翼翼地把眼睛睜開一條縫。\n只見那名穿著和服、留著粉色長髮的魁梧男子正神色平靜地伸出手，將一支螢幕還亮著的手機遞到了我面前——正是我剛才脫力摔倒時掉在草地上的那支。\n\n『別、別傷害我……疑？真的是手機？手機嗎？謝謝你……』\n我愣愣地把手機接了過來，整個人僵在原地，尷尬得恨不得當場用腳趾在水泥地上摳出一棟別墅。\n\n回過神來，我忍不住心有餘悸地摸了摸快跑斷的雙腿，滿臉納悶地抬頭問他：\n『不是啊……那你剛才在單槓那邊，幹嘛我一喊你就拔腿狂奔啊？！』\n\n粉髮男子一聽，臉上頓時浮現出一抹哭笑不得的崩潰神色，沒好氣地反駁道：\n「廢話！誰被一個陌生人那樣大吼大叫地衝過來追著誰不跑啊？！我又穿著女裝，你那嗓門扯得那麼大，我還以為是警察叔叔來抓人了！」\n\n『……』\n我被這過於合理的理由塞得啞口無言。\n\n我還沒完全組織好下一句反駁，眼前這位粉紅色頭髮的先生卻忽然收斂了臉上的無奈，目光直勾勾地盯著我的眼睛，語氣低沉得讓人背脊發涼：\n\n「有事情要發生了。」\n\n『什……什麼？你到底誰啊？幹嘛突然嚇我？！』我握著手機，滿頭霧水地往牆角縮了縮。\n\n男子只是深深地看了我一眼，薄唇微勾：\n「你等等就知道了。」\n\n話音未落，空氣中忽然傳來一陣極微弱的嗡鳴。\n僅僅是眨眼的一剎那，那個存在感十足的粉髮男子，竟然像被風吹散的霧氣一樣，憑空在我眼皮底下消失得無影無蹤！\n\n微風拂過空蕩蕩的牆角。\n只有我手裡握著的手機，還殘留著他剛才遞過來時手掌的餘溫，以及一股淡淡的奇異香氣。\n\n『怪人……真是有夠怪的怪人……』\n我心有餘悸地在褲子上擦了擦手機，心裡忍不住嘀咕：不過說真的，那傢伙五官長得確實挺帥的，扮起女裝來……居然意外地還挺好看？\n\n就在這個念頭剛冒出來的瞬間，掌心裡的手機螢幕突然劇烈震動起來——\n原本卡死多日、顯示無法連線的《忍者喵喵》，竟然毫無預兆地自己彈開了。"};

    let manifestData = [];

    // 將純文字解析為結構化 HTML
    function parseNovelTextToHtml(rawText) {
      const lines = rawText.trim().split(/\r?\n/);
      if (lines.length === 0) return '';

      const titleLine = lines[0].trim();
      const bodyLines = lines.slice(1);
      let htmlOutput = `<h1 class="chapter-heading">${titleLine}</h1><div class="novel-body">`;

      let currentQuoteBuffer = [];
      let inQuote = false;

      for (let i = 0; i < bodyLines.length; i++) {
        const line = bodyLines[i].trim();
        if (!line) continue;

        // 處理多行 [QUOTE: ...] 語法
        if (line.startsWith('[QUOTE:')) {
          inQuote = true;
          const content = line.replace(/^\[QUOTE:\s*/, '');
          if (content.endsWith(']')) {
            inQuote = false;
            htmlOutput += `<div class="quote-box">${content.slice(0, -1)}</div>`;
          } else {
            currentQuoteBuffer.push(content);
          }
          continue;
        }
        if (inQuote) {
          if (line.endsWith(']')) {
            inQuote = false;
            currentQuoteBuffer.push(line.slice(0, -1));
            htmlOutput += `<div class="quote-box">${currentQuoteBuffer.join('<br>')}</div>`;
            currentQuoteBuffer = [];
          } else {
            currentQuoteBuffer.push(line);
          }
          continue;
        }

        // 處理插圖語法 [CG: 圖片路徑 | 圖片說明]
        if (line.startsWith('[CG:') && line.endsWith(']')) {
          const inner = line.slice(4, -1).trim();
          const parts = inner.split('|');
          const imgSrc = parts[0].trim();
          const caption = parts[1] ? parts[1].trim() : '點擊放大預覽';
          htmlOutput += `
            <div class="cg-container">
              <div class="cg-frame" onclick="openModal('${imgSrc}', '【${caption}】')">
                <img src="${imgSrc}" alt="${caption}" class="novel-cg" loading="lazy">
                <div class="cg-caption">【點擊放大】${caption}</div>
              </div>
            </div>
          `;
          continue;
        }

        // 特殊台詞強調
        if (line === '「變態……」') {
          htmlOutput += `<p class="dialogue-critical">${line}</p>`;
          continue;
        }

        // 一般小說段落
        htmlOutput += `<p>${line}</p>`;
      }

      htmlOutput += `</div>`;
      return htmlOutput;
    }

    // 初始化載入章節清單
    async function initSite() {
      try {
        const res = await fetch('chapters/manifest.json');
        if (!res.ok) throw new Error('Fetch failed');
        manifestData = await res.json();
      } catch (err) {
        manifestData = fallbackManifest;
      }

      renderNavigationAndCards();
    }

    function renderNavigationAndCards() {
      const navContainer = document.getElementById('nav-tabs-container');
      const gridContainer = document.getElementById('chapters-grid-container');

      manifestData.forEach(item => {
        // 生成頂部導航按鈕
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (item.isFocus ? ' tab-focus' : '');
        btn.id = 'tab-ch' + item.id;
        btn.innerText = item.tabTitle;
        btn.onclick = () => openChapter(item.id);
        navContainer.appendChild(btn);

        // 生成首頁卡片
        const card = document.createElement('div');
        card.className = 'chapter-card';
        if (item.isFocus) {
          card.style.borderColor = 'rgba(244, 63, 94, 0.45)';
        }
        card.onclick = () => openChapter(item.id);

        let tagClass = 'episode-tag';
        if (item.isFocus) tagClass += ' highlight';
        else if (item.badge.includes('最新')) tagClass += ' latest';

        card.innerHTML = `
          <div class="card-thumb">
            <img src="${item.cover}" alt="${item.title}" loading="lazy">
            <span class="${tagClass}">${item.badge}</span>
          </div>
          <div class="card-body">
            <h3 class="card-title">${item.title}</h3>
            <p class="card-text">${item.desc}</p>
            <div class="card-action">展開閱讀 <span>→</span></div>
          </div>
        `;
        gridContainer.appendChild(card);
      });
    }

    function switchView(view) {
      const homeView = document.getElementById('home-view');
      const readerView = document.getElementById('reader-view');
      const tabHome = document.getElementById('tab-home');

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      if (view === 'home') {
        homeView.style.display = 'block';
        readerView.style.display = 'none';
        tabHome.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        homeView.style.display = 'none';
        readerView.style.display = 'block';
      }
    }

    async function openChapter(chId) {
      const item = manifestData.find(x => x.id === chId);
      if (!item) return;

      currentChapterId = chId;
      switchView('reader');

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeTab = document.getElementById('tab-ch' + chId);
      if (activeTab) activeTab.classList.add('active');

      document.getElementById('reader-ep-label').innerText = item.label;
      const targetDiv = document.getElementById('reader-content-target');
      targetDiv.innerHTML = '<p style="text-align:center; padding:40px; color:#64748b;">載入章節中...</p>';

      let rawText = '';
      try {
        const res = await fetch(item.file);
        if (!res.ok) throw new Error('File fetch failed');
        rawText = await res.text();
      } catch (err) {
        rawText = fallbackTexts[chId] || '找不到章節內容。';
      }

      targetDiv.innerHTML = parseNovelTextToHtml(rawText);

      // 依序號 1 -> 2 -> 3 -> 4 -> 5 控制上一節 / 下一節
      const maxId = Math.max(...manifestData.map(x => x.id));
      const minId = Math.min(...manifestData.map(x => x.id));
      document.getElementById('prev-btn').style.display = (chId <= minId) ? 'none' : 'inline-flex';
      document.getElementById('next-btn').style.display = (chId >= maxId) ? 'none' : 'inline-flex';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function turnPage(offset) {
      const targetId = currentChapterId + offset;
      if (manifestData.some(x => x.id === targetId)) {
        openChapter(targetId);
      }
    }

    function openModal(src, caption) {
      const modal = document.getElementById('lightboxModal');
      const modalImg = document.getElementById('modalImg');
      const modalCap = document.getElementById('modalCaption');
      modalImg.src = src;
      modalCap.innerText = caption;
      modal.classList.add('active');
    }

    function closeModal(e) {
      const modal = document.getElementById('lightboxModal');
      modal.classList.remove('active');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    // 啟動網站
    initSite();
  </script>
</body>
</html>
